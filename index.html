<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Inggris Pribadi (A1–C2)</title>
<style>
  :root { --bg:#f7f5ef; --card:#ffffff; --ink:#222; --muted:#6b6b6b; --acc:#1a7a4c; --acc2:#0d4d2e; --warn:#b7791f; --line:#e5e0d3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  header { background:var(--acc2); color:#fff; padding:14px 18px; position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:18px; }
  header small { opacity:.8; }
  nav { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  nav a, nav span { color:#fff; text-decoration:none; background:rgba(255,255,255,.14); padding:6px 12px; border-radius:20px; font-size:13px; }
  nav a.active, nav a:hover { background:#fff; color:var(--acc2); }
  nav span.soon { opacity:.55; }
  .topbar { display:flex; align-items:center; gap:10px; }
  #menu-btn { display:none; background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:8px; font-size:19px; padding:2px 10px; cursor:pointer; }
  .layout { display:flex; align-items:stretch; }
  aside.sidebar { width:235px; flex-shrink:0; padding:14px 12px; }
  aside.sidebar .sidebox { position:sticky; top:86px; max-height:calc(100vh - 100px); overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  aside.sidebar nav { display:flex; flex-direction:column; gap:8px; margin-top:0; }
  aside.sidebar nav a { display:block; }
  aside.sidebar .langbox { font-size:13px; background:rgba(13,77,46,.08); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  aside.sidebar .langbox a { color:var(--acc2); }
  main { flex:1; min-width:0; max-width:980px; margin:0 auto; padding:18px 14px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .levels h2 { margin:26px 0 6px; }
  .modgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .mod { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .mod:hover { border-color:var(--acc); }
  .mod.done { border-left:6px solid var(--acc); }
  .mod .meta { font-size:12px; color:var(--muted); }
  .badge { display:inline-block; font-size:11px; background:#eef5ef; color:var(--acc2); border-radius:10px; padding:2px 8px; margin-right:6px; }
  .badge.done { background:var(--acc); color:#fff; }
  .progress { height:10px; background:#e8e2d2; border-radius:6px; overflow:hidden; }
  .progress > div { height:100%; background:var(--acc); width:0; }
  .btn { display:inline-block; background:var(--acc); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:14px; cursor:pointer; text-decoration:none; }
  .btn:hover { background:var(--acc2); }
  .btn.ghost { background:#fff; color:var(--acc2); border:1px solid var(--acc); }
  .ex { background:#f2f7f3; border-radius:8px; padding:8px 10px; margin:6px 0; }
  .ex code { background:#e4efe6; padding:1px 6px; border-radius:6px; }
  table.vocab { width:100%; border-collapse:collapse; font-size:14px; }
  table.vocab td { border-bottom:1px dashed var(--line); padding:6px 4px; }
  .quiz-q { border:1px solid var(--line); border-radius:10px; padding:10px; margin:10px 0; }
  .quiz-q label { display:block; margin:4px 0; cursor:pointer; }
  .fb { margin-top:8px; padding:8px 10px; border-radius:8px; font-size:14px; }
  .fb.ok { background:#e6f4ea; } .fb.no { background:#fdecea; }
  .tip { background:#fff8e6; border-left:4px solid var(--warn); padding:8px 10px; border-radius:0 8px 8px 0; }
  .fc-filters button { margin:2px 4px 2px 0; }
  .fc-filters .on { background:var(--acc2); color:#fff; border-color:var(--acc2); }
  .fc-card { text-align:center; padding:28px 18px; }
  .fc-card .term { font-size:30px; font-weight:700; margin:6px 0; }
  .fc-card .pron { color:var(--muted); }
  .fc-back { background:#f2f7f3; border-radius:10px; padding:12px; margin-top:12px; }
  .fc-rate { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .dlg-line { margin:6px 0; padding:6px 10px; background:#f7faf8; border-radius:8px; }
  .dlg-line b.sp { display:inline-block; min-width:22px; text-align:center; background:var(--acc); color:#fff; border-radius:11px; font-size:12px; padding:0 6px; margin-right:6px; }
  aside.sidebar nav a { color:var(--acc2); background:#eef5ef; }
  aside.sidebar nav a.active, aside.sidebar nav a:hover { background:var(--acc2); color:#fff; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
  .scrollbox { max-height:440px; overflow-y:auto; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fbfaf6; }
  .scrollbox.tall { max-height:520px; }
  .fc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .fc-item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .fc-item .w { font-weight:700; font-size:16px; }
  .fc-item .m { font-size:13px; color:var(--muted); }
  .fc-item .row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .spk { background:#fff; border:1px solid var(--line); border-radius:8px; cursor:pointer; padding:2px 8px; font-size:14px; }
  .spk:hover { border-color:var(--acc); }
  .form3 { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:6px 0; }
  .form3 .lbl { display:inline-block; font-size:11px; font-weight:700; border-radius:8px; padding:1px 8px; margin-bottom:4px; }
  .form3.pos .lbl { background:#e6f4ea; color:#0d4d2e; }
  .form3.neg .lbl { background:#fdecea; color:#8c2f1b; }
  .form3.q .lbl { background:#e8effd; color:#1d3f8c; }
  .simnav { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .simnav button.on { background:var(--acc2); color:#fff; border-color:var(--acc2); }
  .timer { font-size:20px; font-weight:700; background:#fff8e6; border:1px solid var(--warn); border-radius:10px; padding:4px 14px; display:inline-block; }
  textarea.answer { width:100%; min-height:140px; padding:10px; border-radius:10px; border:1px solid var(--line); font-family:inherit; font-size:14px; }
  @media (max-width:600px){ .modgrid{grid-template-columns:1fr;} }
  @media (max-width:820px){
    #menu-btn { display:inline-block; }
    aside.sidebar { position:fixed; left:0; top:0; bottom:0; width:260px; z-index:30; background:var(--bg); padding:16px 12px;
      transform:translateX(-105%); transition:transform .2s ease; box-shadow:2px 0 12px rgba(0,0,0,.18); }
    aside.sidebar.open { transform:none; }
    aside.sidebar .sidebox { position:static; max-height:none; overflow:visible; }
  }
</style>

<script>
(function(){
  "use strict";
  var KEY = "engProgressV1";
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {done:{}}; } catch(e){ return {done:{}}; } }
  function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
  var store = load();
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function canSpeak(){ try { return ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window); } catch(e){ return false; } }
  function speakBtn(text){
    if(!canSpeak()) return "";
    return ' <button class="spk" data-speak="'+esc(text)+'" title="Dengarkan pengucapan" aria-label="Dengarkan pengucapan">🔊</button>';
  }
  function doSpeak(text){
    try {
      if(!canSpeak()) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      window.speechSynthesis.speak(u);
    } catch(e){ /* jangan ganggu fitur lain */ }
  }
  function modById(id){ return DATA_EN.modules.find(function(m){return m.id===id;}); }
  function order(){ return DATA_EN.modules.slice(); }
  function doneCount(list){ return list.filter(function(m){return store.done[m.id];}).length; }
  function firstUndone(){ var o=order(); for(var i=0;i<o.length;i++){ if(!store.done[o[i].id]) return o[i]; } return o[o.length-1]; }

  function dashboard(){
    var mods = order();
    var total = mods.length, done = doneCount(mods);
    var pct = total? Math.round(done/total*100):0;
    var cont = firstUndone();
    var h = "";
    h += '<div class="card"><h2 style="margin:0 0 6px">Progress keseluruhan: '+done+' / '+total+' ('+pct+'%)</h2>';
    h += '<div class="progress"><div style="width:'+pct+'%"></div></div>';
    h += '<p><a class="btn" href="#/module/'+cont.id+'">Lanjut: '+esc(cont.id)+' · '+esc(cont.title)+'</a></p></div>';
    var levels = ["A1","A2","B1","B2","C1","C2"];
    levels.forEach(function(lv){
      var lm = mods.filter(function(m){return m.level===lv;});
      var d = doneCount(lm), p = lm.length? Math.round(d/lm.length*100):0;
      h += '<div class="levels"><h2>Level '+lv+' — '+d+'/'+lm.length+'</h2>';
      h += '<div class="progress"><div style="width:'+p+'%"></div></div><div class="modgrid">';
      lm.forEach(function(m){
        var isd = !!store.done[m.id];
        h += '<a class="mod'+(isd?' done':'')+'" href="#/module/'+m.id+'">'
          + '<div><span class="badge">'+esc(m.n)+'</span>'+(isd?'<span class="badge done">selesai</span>':'')+'</div>'
          + '<div><b>'+esc(m.id)+' · '+esc(m.title)+'</b></div>'
          + '<div class="meta">'+esc(m.tag)+' · '+m.duration+' mnt · '+esc(m.level)+'</div>'
          + '<div class="meta">'+esc(m.description)+'</div></a>';
      });
      h += '</div></div>';
    });
    return h;
  }

  function modulePage(id){
    var m = modById(id);
    if(!m) return '<div class="card"><p>Modul '+esc(id)+' tidak ditemukan.</p><p><a class="btn ghost" href="#/">Kembali</a></p></div>';
    var h = '<p><a class="btn ghost" href="#/">&larr; Dashboard</a></p>';
    h += '<div class="card"><h2 style="margin:0">'+esc(m.id)+' · '+esc(m.n)+' · '+esc(m.title)+'</h2>'
      + '<p class="meta">'+esc(m.description)+'</p>'
      + '<p><span class="badge">'+esc(m.level)+'</span><span class="badge">'+esc(m.tag)+'</span><span class="badge">'+m.duration+' menit</span>'
      + (store.done[m.id]?'<span class="badge done">selesai</span>':'<span class="badge">belum selesai</span>')+'</p></div>';
    m.sections.forEach(function(s){
      h += '<div class="card"><h3>Bagian '+s.num+': '+esc(s.title)+'</h3>';
      s.explanation.forEach(function(p){ h += '<p>'+esc(p)+'</p>'; });
      h += '<h4>Contoh</h4>';
      s.examples.forEach(function(e){
        if(e.target) h += '<div class="ex"><code>'+esc(e.target)+'</code>'+speakBtn(e.target)+'<br>'+esc(e.translation)+'</div>';
        else h += '<div class="ex">'+esc(e.raw)+'</div>';
      });
      h += '<h4>Kosakata baru</h4><table class="vocab">';
      s.vocab.forEach(function(v){
        if(v.word) h += '<tr><td><code>'+esc(v.word)+'</code>'+speakBtn(v.word)+'</td><td>'+esc(v.meaning)+'</td></tr>';
        else h += '<tr><td colspan="2">'+esc(v.raw)+'</td></tr>';
      });
      h += '</table><div class="tip"><b>Tips:</b> '+esc(s.tip)+'</div>';
      if(s.quiz && s.quiz.length){
        h += '<h4>Kuis mini Bagian '+s.num+'</h4>';
        s.quiz.forEach(function(q,qi){
          var qid = m.id+'-s'+s.num+'-q'+qi;
          h += '<div class="quiz-q" data-qid="'+qid+'"><p><b>'+(qi+1)+'. '+esc(q.question)+'</b></p>';
          ["A","B","C","D"].forEach(function(k){
            h += '<label><input type="radio" name="'+qid+'" value="'+k+'"> '+k+') '+esc(q.options[k])+'</label>';
          });
          h += '<button class="btn ghost" data-check="'+qid+'">Cek jawaban</button><div class="fb" id="fb-'+qid+'" hidden></div>';
          h += '<div data-answer="'+qid+'" hidden>'+esc(q.answer)+'|'+esc(q.reason)+'</div></div>';
        });
      }
      h += '</div>';
    });
    h += '<div class="card"><button class="btn" id="btn-done">'+(store.done[m.id]?'Batalkan tanda selesai':'Tandai selesai')+'</button> '
      + '<span id="done-msg" style="font-size:13px;color:#555"></span></div>';
    return h;
  }

  function bindModule(id){
    var m = modById(id); if(!m) return;
    document.querySelectorAll("[data-check]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var qid = btn.getAttribute("data-check");
        var box = document.getElementById("fb-"+CSS.escape(qid));
        var ans = document.querySelector('[data-answer="'+qid+'"]');
        var parts = ans.textContent.split("|");
        var correct = parts[0], reason = parts.slice(1).join("|");
        var sel = document.querySelector('input[name="'+CSS.escape(qid)+'"]:checked');
        if(!sel){ box.hidden=false; box.className="fb no"; box.textContent="Pilih salah satu jawaban dulu."; return; }
        if(sel.value===correct){ box.hidden=false; box.className="fb ok"; box.textContent="Benar! "+reason; }
        else { box.hidden=false; box.className="fb no"; box.textContent="Kurang tepat. Jawaban benar: "+correct+". "+reason; }
      });
    });
    var b = document.getElementById("btn-done");
    if(b) b.addEventListener("click", function(){
      if(store.done[m.id]) delete store.done[m.id]; else store.done[m.id]=true;
      save(store);
      location.reload();
    });
  }

  var DAY = 86400000;
  var fcState = { view:"list", tier:"Semua", q:"", status:"Semua", cardIdx:0, queue:[], pos:0, flipped:false, doneSession:0 };
  function srs(){ if(!store.srs) store.srs = {}; return store.srs; }
  function fcStatusOf(gi){
    var st = srs()[gi];
    if(!st) return "baru";
    if(st.rating==="Mudah") return "dikuasai";
    return "sedang belajar";
  }
  function fcFiltered(){
    var q = fcState.q.trim().toLowerCase();
    var out = [];
    DATA_EN.flashcards.forEach(function(c, gi){
      if(fcState.tier!=="Semua" && c.tier!==fcState.tier) return;
      if(fcState.status!=="Semua" && fcStatusOf(gi)!==fcState.status) return;
      if(q && (c.term+" "+c.meaning+" "+c.example).toLowerCase().indexOf(q)<0) return;
      out.push({c:c, gi:gi});
    });
    return out;
  }
  function fcDueCount(list){
    var now = Date.now(), s = srs(), n = 0;
    list.forEach(function(o){
      var st = s[o.gi!=null? o.gi : DATA_EN.flashcards.indexOf(o.c||o)];
      if(!st || st.nextDue <= now) n++;
    });
    return n;
  }
  function fcBuildQueue(){
    var all = DATA_EN.flashcards;
    var list = all.filter(function(c){ return fcState.tier==="Semua" || c.tier===fcState.tier; });
    var now = Date.now(), s = srs();
    var due = [], fresh = [];
    list.forEach(function(c){
      var st = s[all.indexOf(c)];
      if(!st || st.nextDue <= now) due.push(c); else fresh.push(c);
    });
    // acak ringan agar tidak hafal urutan
    function shuf(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
    fcState.queue = shuf(due).concat(shuf(fresh));
    fcState.pos = 0; fcState.flipped = false; fcState.doneSession = 0;
  }
  function fcTabs(){
    return '<p><button class="btn ghost fc-view" data-v="list" style="margin:2px;'+(fcState.view==="list"?'background:var(--acc2);color:#fff;':'')+'">Daftar Flashcard</button>'
      + '<button class="btn ghost fc-view" data-v="card" style="margin:2px;'+(fcState.view==="card"?'background:var(--acc2);color:#fff;':'')+'">Mode Kartu</button>'
      + '<button class="btn ghost fc-view" data-v="srs" style="margin:2px;'+(fcState.view==="srs"?'background:var(--acc2);color:#fff;':'')+'">Belajar Acak (SRS)</button></p>';
  }
  function fcFilters(showStatus){
    var h = '<p style="font-size:13px">Filter tingkat: '
      + ["Semua","Pemula","Menengah","Mahir"].map(function(t){
          return '<button class="btn ghost fc-f" data-tier="'+t+'" style="padding:4px 10px;margin:2px;'+(fcState.tier===t?'background:var(--acc2);color:#fff;':'')+'">'+t+'</button>';
        }).join("");
    if(showStatus){
      h += '<br>Status: '
        + ["Semua","baru","sedang belajar","dikuasai"].map(function(t){
            var lbl = t==="Semua" ? "Semua status" : t;
            return '<button class="btn ghost fc-s" data-st="'+t+'" style="padding:4px 10px;margin:2px;'+(fcState.status===t?'background:var(--acc2);color:#fff;':'')+'">'+lbl+'</button>';
          }).join("");
    }
    h += '</p>';
    return h;
  }
  function fcListView(){
    var list = fcFiltered();
    var due = fcDueCount(list);
    var h = '<div class="card"><h2 style="margin:0">Daftar Flashcard ('+list.length+' / '+DATA_EN.flashcards.length+')</h2>'
      + fcTabs()

  function fcRate(gi, r){
    var gap = r==="Mudah"? 3*DAY : r==="Sedang"? 2*DAY : DAY;
    var s = srs(); s[gi] = { rating:r, nextDue: Date.now()+gap, reps:(s[gi]?s[gi].reps+1:1) };
    save(store);
  }
  function bindFlashcard(){
    document.querySelectorAll(".fc-view").forEach(function(b){
      b.addEventListener("click", function(){ fcState.view = b.getAttribute("data-v"); if(fcState.view==="srs") fcBuildQueue(); rerender(); });
    });
    document.querySelectorAll(".fc-f").forEach(function(b){
      b.addEventListener("click", function(){ fcState.tier = b.getAttribute("data-tier"); fcState.cardIdx = 0; if(fcState.view==="srs") fcBuildQueue(); rerender(); });
    });
    document.querySelectorAll(".fc-s").forEach(function(b){
      b.addEventListener("click", function(){ fcState.status = b.getAttribute("data-st"); rerender(); });
    });
    var qi = document.getElementById("fc-q");
    if(qi) qi.addEventListener("input", function(){ fcState.q = qi.value; rerender(true); });
    document.querySelectorAll(".fc-open").forEach(function(b){
      b.addEventListener("click", function(){
        var gi = parseInt(b.getAttribute("data-gi"), 10);
        var list = fcFiltered();
        for(var i=0;i<list.length;i++){ if(list[i].gi===gi){ fcState.cardIdx = i; break; } }
        fcState.view = "card"; fcState.flipped = false;
        rerender();
      });
    });
    var gs = document.getElementById("fc-go-srs");
    if(gs) gs.addEventListener("click", function(){ fcState.view = "srs"; fcBuildQueue(); rerender(); });
    var f = document.getElementById("fc-flip");
    if(f) f.addEventListener("click", function(){ fcState.flipped = true; rerender(); });
    document.querySelectorAll("[data-rate]").forEach(function(b){
      b.addEventListener("click", function(){
        var r = b.getAttribute("data-rate");
        if(fcState.view==="card"){
          var list = fcFiltered();
          var o = list[fcState.cardIdx];
          if(o) fcRate(o.gi, r);
          fcState.flipped = false;
          if(fcState.cardIdx < list.length-1) fcState.cardIdx++;
          rerender();
        } else {
          var c = fcState.queue[fcState.pos];
          var gi = DATA_EN.flashcards.indexOf(c);
          fcRate(gi, r);
          fcState.pos++; fcState.flipped = false; fcState.doneSession++;
          rerender();
        }
      });
    });
    var pv = document.getElementById("fc-prev");
    if(pv) pv.addEventListener("click", function(){ if(fcState.cardIdx>0){ fcState.cardIdx--; fcState.flipped=false; } rerender(); });
    var nx = document.getElementById("fc-next");
    if(nx) nx.addEventListener("click", function(){ fcState.cardIdx++; fcState.flipped=false; rerender(); });
    var bl = document.getElementById("fc-back-list");
    if(bl) bl.addEventListener("click", function(){ fcState.view = "list"; rerender(); });
    var rs = document.getElementById("fc-restart");
    if(rs) rs.addEventListener("click", function(){ fcBuildQueue(); rerender(); });
  }

  var qzState = { tier:"Semua", count:10, items:[], answers:{}, submitted:false, started:false };
  function qzPool(){
    return DATA_EN.quizBank.filter(function(q){ return qzState.tier==="Semua" || q.tier===qzState.tier; });
  }
  function qzStart(){
    var pool = qzPool().slice();
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    qzState.items = pool.slice(0, Math.min(qzState.count, pool.length));
    qzState.answers = {}; qzState.submitted = false; qzState.started = true;
  }
  function quizPage(){
    var pool = qzPool();
    var h = '<div class="card"><h2 style="margin:0">Bank Kuis Acak</h2>'
      + '<p style="font-size:13px">Soal diambil acak dari seluruh bank (bukan kuis modul). Filter: '
      + ["Semua","Pemula","Menengah","Mahir"].map(function(t){
          return '<button class="btn ghost qz-f" data-tier="'+t+'" style="padding:4px 10px;margin:2px;'+(qzState.tier===t?'background:var(--acc2);color:#fff;':'')+'">'+t+'</button>';
        }).join("")
      + '<br>Jumlah: '+[5,10,20,30,50].map(function(n){
          return '<button class="btn ghost qz-n" data-n="'+n+'" style="padding:4px 10px;margin:2px;'+(qzState.count===n?'background:var(--acc2);color:#fff;':'')+'">'+n+'</button>';
        }).join("")
      + '<br><span>Tersedia: <b>'+pool.length+'</b> soal. '
      + (store.quizBest? 'Skor terbaik tersimpan: <b>'+esc(store.quizBest.score)+'/'+esc(store.quizBest.total)+' ('+esc(store.quizBest.tier)+')</b> · Terakhir: <b>'+esc(store.quizLast.score)+'/'+esc(store.quizLast.total)+'</b>':'Belum ada skor tersimpan.')
      + '</span></p><p><button class="btn" id="qz-start">Mulai kuis acak</button></p></div>';
    if(qzState.started && qzState.items.length){
      if(!qzState.submitted){
        h += '<form id="qz-form">';
        qzState.items.forEach(function(q,i){
          h += '<div class="quiz-q"><p><b>'+(i+1)+'. '+esc(q.question)+'</b> <span class="badge">'+esc(q.tier)+'</span></p>';
          ["A","B","C","D"].forEach(function(k){
            var checked = qzState.answers[i]===k? ' checked':'';
            h += '<label><input type="radio" name="qz'+i+'" value="'+k+'"'+checked+'> '+k+') '+esc(q.options[k])+'</label>';
          });
          h += '</div>';
        });
        h += '<p><button type="submit" class="btn">Kumpulkan &amp; lihat skor</button></p></form>';
      } else {
        var correct = 0;
        qzState.items.forEach(function(q){ if(qzState.answers[qzState.items.indexOf(q)]===q.answer) correct++; });
        h += '<div class="card"><h3>Skor akhir: '+correct+' / '+qzState.items.length+' ('+Math.round(correct/qzState.items.length*100)+'%)</h3>'
          + '<p><button class="btn ghost" id="qz-retry">Acak lagi</button></p></div>';
        qzState.items.forEach(function(q,i){
          var mine = qzState.answers[i], ok = mine===q.answer;
          h += '<div class="quiz-q"><p><b>'+(i+1)+'. '+esc(q.question)+'</b></p>'
            + '<p>Jawabanmu: <b>'+esc(mine||"-")+'</b> · Kunci: <b>'+esc(q.answer)+'</b></p>'
            + '<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Benar! ':'Kurang tepat. ')+esc(q.reason)+'</div></div>';
        });
      }
    }
    return h;
  }
  function bindQuiz(){
    document.querySelectorAll(".qz-f").forEach(function(b){
      b.addEventListener("click", function(){ qzState.tier=b.getAttribute("data-tier"); qzState.started=false; qzRerender(); });
    });
    document.querySelectorAll(".qz-n").forEach(function(b){
      b.addEventListener("click", function(){ qzState.count=parseInt(b.getAttribute("data-n"),10); qzRerender(); });
    });
    var st = document.getElementById("qz-start");
    if(st) st.addEventListener("click", function(){ qzStart(); qzRerender(); });
    var form = document.getElementById("qz-form");
    if(form) form.addEventListener("submit", function(ev){
      ev.preventDefault();
      qzState.items.forEach(function(q,i){
        var sel = form.querySelector('input[name="qz'+i+'"]:checked');
        qzState.answers[i] = sel? sel.value : null;
      });
      var correct = 0;
      qzState.items.forEach(function(q,i){ if(qzState.answers[i]===q.answer) correct++; });
      qzState.submitted = true;
      store.quizLast = { score:correct, total:qzState.items.length, tier:qzState.tier, when:Date.now() };
      if(!store.quizBest || correct/qzState.items.length >= store.quizBest.score/store.quizBest.total)
        store.quizBest = { score:correct, total:qzState.items.length, tier:qzState.tier, when:Date.now() };
      save(store);
      qzRerender();
    });
    var rt = document.getElementById("qz-retry");
    if(rt) rt.addEventListener("click", function(){ qzStart(); qzRerender(); });
  }

    var app = document.getElementById("app");

  }

  var grState = { tier:"Semua", q:"" };
  function grammarPage(){
    var q = grState.q.trim().toLowerCase();
    function match(g){
      if(grState.tier!=="Semua" && g.tier!==grState.tier) return false;
      if(!q) return true;
      return (g.name+" "+g.formula+" "+g.description+" "+g.category+" "+g.level+" "+g.mistake).toLowerCase().indexOf(q)>=0;
    }
    var h = '<div class="card"><h2 style="margin:0">Pola Tata Bahasa ('+DATA_EN.grammar.length+')</h2>'
      + '<p><input type="search" id="gr-q" placeholder="Cari pola, rumus, atau kata kunci..." value="'+esc(grState.q)+'" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line)"></p>'
      + '<p style="font-size:13px">Tingkat: '
      + ["Semua","Pemula","Menengah","Mahir"].map(function(t){
          return '<button class="btn ghost gr-f" data-tier="'+t+'" style="padding:4px 10px;margin:2px;'+(grState.tier===t?'background:var(--acc2);color:#fff;':'')+'">'+t+'</button>';
        }).join("") + '</p></div>';
    ["Pemula","Menengah","Mahir"].forEach(function(tier){
      if(grState.tier!=="Semua" && grState.tier!==tier) return;
      var items = DATA_EN.grammar.filter(function(g){ return g.tier===tier && match(g); });
      if(!items.length) return;
      h += '<div class="levels"><h2>'+tier+' — '+items.length+'</h2>';
      items.forEach(function(g){
        h += '<div class="card"><p style="margin:0"><b>'+esc(g.name)+'</b></p>'
          + '<p style="font-size:12px;color:#555"><span class="badge">'+esc(g.tier)+'</span><span class="badge">'+esc(g.level)+'</span><span class="badge">'+esc(g.category)+'</span></p>'
          + '<p>'+esc(g.description)+'</p>'
          + '<p><b>Rumus:</b> <code>'+esc(g.formula)+'</code></p>';
        g.examples.forEach(function(e){
          if(e.target) h += '<div class="ex"><code>'+esc(e.target)+'</code>'+speakBtn(e.target)+'<br>'+esc(e.translation)+'</div>';
          else h += '<div class="ex">'+esc(e.raw)+'</div>';
        });
        if(g.forms && (g.forms.positive || g.forms.negative || g.forms.question)){
          h += '<h4>Tiga bentuk kalimat</h4>';
          if(g.forms.positive) h += '<div class="form3 pos"><span class="lbl">Positif</span><br><code>'+esc(g.forms.positive.target)+'</code>'+speakBtn(g.forms.positive.target)+'<br>'+esc(g.forms.positive.translation)+'</div>';
          if(g.forms.negative) h += '<div class="form3 neg"><span class="lbl">Negatif</span><br><code>'+esc(g.forms.negative.target)+'</code>'+speakBtn(g.forms.negative.target)+'<br>'+esc(g.forms.negative.translation)+'</div>';
          if(g.forms.question) h += '<div class="form3 q"><span class="lbl">Tanya</span><br><code>'+esc(g.forms.question.target)+'</code>'+speakBtn(g.forms.question.target)+'<br>'+esc(g.forms.question.translation)+'</div>';
        }
        h += '<div class="tip"><b>Kesalahan umum:</b> '+esc(g.mistake)+'</div></div>';
      });
      h += '</div>';
    });
    return h;
  }

  }
  function grRerender(keepFocus){
    var app = document.getElementById("app");
    app.innerHTML = grammarPage(); bindGrammar();
    if(keepFocus){
      var inp = document.getElementById("gr-q");
      if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    } else window.scrollTo(0,0);
  }

  var exState = { sel:0, revealed:{} };
  function examPage(){
    var h = '<div class="card"><h2 style="margin:0">Persiapan Ujian</h2><p style="font-size:13px">'
      + DATA_EN.examPrep.map(function(e,i){
          return '<button class="btn ghost ex-f" data-i="'+i+'" style="margin:2px;'+(exState.sel===i?'background:var(--acc2);color:#fff;':'')+'">'+esc(e.exam)+'</button>';
        }).join("") + '</p></div>';
    var e = DATA_EN.examPrep[exState.sel];
    if(!e) return h;
    h += '<div class="card"><h3 style="margin:0">'+esc(e.exam)+'</h3>'
      + '<p><b>Format &amp; durasi:</b> '+esc(e.format)+'</p>'
      + '<h4>5 strategi terpenting</h4><ol>'
      + e.strategies.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join("")
      + '</ol></div>';
    h += '<div class="card"><h4>3 contoh soal representatif</h4>';
    e.samples.forEach(function(s,i){
      var rk = exState.sel+":"+i;
      h += '<div class="quiz-q"><p><b>'+(i+1)+'. '+esc(s.question)+'</b></p>'
        + '<button class="btn ghost ex-show" data-rk="'+rk+'">'+(exState.revealed[rk]?'Sembunyikan kunci':'Lihat kunci + pembahasan')+'</button>';
      if(exState.revealed[rk]) h += '<div class="fb ok"><b>Kunci:</b> '+esc(s.answer)+'<br><b>Pembahasan:</b> '+esc(s.explanation)+'</div>';
      h += '</div>';
    });
    h += '</div>';
    return h;
  }
  function bindExam(){
    document.querySelectorAll(".ex-f").forEach(function(b){
      b.addEventListener("click", function(){ exState.sel=parseInt(b.getAttribute("data-i"),10); exRerender(); });
    });
    document.querySelectorAll(".ex-show").forEach(function(b){
      b.addEventListener("click", function(){
        var k=b.getAttribute("data-rk");
        exState.revealed[k]=!exState.revealed[k];
        exRerender();
      });
    });
  }
  function exRerender(){
    var app = document.getElementById("app");
    app.innerHTML = examPage(); bindExam();
    window.scrollTo(0,0);
  }

  var simState = { group:"IELTS", sel:0, idx:0, answers:{}, texts:{}, submitted:false, remaining:0, timerId:null, started:false, wrongOnly:false };
  function simGroups(){
    var g = {};
    (DATA_EN.examSim||[]).forEach(function(s){ var k = s.exam || "Lainnya"; (g[k] = g[k] || []).push(s); });
    return g;
  }
  function simCurrent(){
    var g = simGroups();
    var keys = Object.keys(g);
    if(!g[simState.group]) simState.group = keys[0];
    var arr = g[simState.group] || [];
    if(simState.sel >= arr.length) simState.sel = 0;
    return arr[simState.sel];
  }
  function simFmt(sec){
    if(sec<0) sec = 0;
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
  }
  function simStopTimer(){ if(simState.timerId){ clearInterval(simState.timerId); simState.timerId = null; } }
  function simStartTimer(){
    simStopTimer();
    simState.remaining = simCurrent().durationMinutes*60;
    simState.timerId = setInterval(function(){
      simState.remaining--;
      var el = document.getElementById("sim-timer");
      if(el) el.textContent = simFmt(simState.remaining);
      if(simState.remaining<=0){ simStopTimer(); simSubmit(true); }
    }, 1000);
  }
  function simMcqItems(sec){ return sec.items.filter(function(it){ return it.type!=="prompt"; }); }
  function simCollect(){
    var sec = simCurrent();
    sec.items.forEach(function(it){
      if(it.type==="prompt"){
        var ta = document.getElementById("sim-txt-"+it.no);
        if(ta) simState.texts[sec.id+":"+it.no] = ta.value;
      } else {
        var sel = document.querySelector('input[name="sim'+it.no+'"]:checked');
        if(sel) simState.answers[sec.id+":"+it.no] = sel.value;
      }
    });
  }
  function simSubmit(auto){
    simCollect();
    simState.submitted = true;
    simStopTimer();
    var sec = simCurrent();
    sec.items.forEach(function(it){
      if(it.type==="prompt"){
        if(!store.simWriting) store.simWriting = {};
        store.simWriting[sec.id+":"+it.no] = simState.texts[sec.id+":"+it.no] || "";
      }
    });
    save(store);
    simRerender();
    if(auto) window.scrollTo(0,0);
  }
  function simScore(sec){
    var items = simMcqItems(sec), ok = 0;
    items.forEach(function(it){
      if(simState.answers[sec.id+":"+it.no]===it.answer) ok++;
    });
    return { ok:ok, total:items.length };
  }
  function simPage(){
    var groups = simGroups();
    var keys = Object.keys(groups);
    var h = '<div class="card"><h2 style="margin:0">Simulasi Ujian</h2><p style="font-size:13px">Tes penuh berwaktu dari data Simulasi Ujian (terpisah dari strategi Persiapan Ujian).</p>'
      + '<p>' + keys.map(function(k){
          return '<button class="btn ghost sim-g" data-g="'+esc(k)+'" style="margin:2px;'+(simState.group===k?'background:var(--acc2);color:#fff;':'')+'">'+esc(k)+'</button>';
        }).join("") + '</p>';
    var arr = groups[simState.group] || [];
    h += '<div class="simnav">' + arr.map(function(s, i){
      return '<button class="btn ghost sim-s" data-i="'+i+'" style="'+(simState.sel===i?'background:var(--acc2);color:#fff;':'')+'">'+esc(s.title)+' ('+s.items.length+')</button>';
    }).join("") + '</div></div>';
    var sec = simCurrent();
    if(!sec) return h;
    h += '<div class="card"><h3 style="margin:0">'+esc(sec.title)+'</h3>'
      + '<p style="font-size:13px">Durasi: <b>'+esc(sec.durationRaw)+'</b> · Jumlah soal: <b>'+sec.items.length+'</b><br>Instruksi: '+esc(sec.instructions)+'</p>';
    if(!simState.started){
      h += '<p><button class="btn" id="sim-start">Mulai simulasi</button></p></div>';
      return h;
    }
    if(!simState.submitted){
      h += '<p><span class="timer" id="sim-timer">'+simFmt(simState.remaining)+'</span> <span style="font-size:12px;color:#555">sisa waktu</span></p>';
      h += '<div class="simnav">' + sec.items.map(function(it, i){
        var a = it.type==="prompt" ? (simState.texts[sec.id+":"+it.no] ? "✓" : it.no) : (simState.answers[sec.id+":"+it.no] ? "✓" : it.no);
        return '<button class="btn ghost sim-j" data-j="'+i+'" style="padding:4px 10px;'+(simState.idx===i?'background:var(--acc2);color:#fff;':'')+'">'+a+'</button>';
      }).join("") + '</div>';
      var it = sec.items[simState.idx];
      h += '<div class="quiz-q"><p><b>Soal '+it.no+' / '+sec.items.length+'</b> '+(it.type==="prompt"?'<span class="badge">tulis jawaban</span>':'<span class="badge">pilihan ganda</span>')+'</p>'
        + '<p>'+esc(it.question)+'</p>';
      if(it.type==="prompt"){
        var saved = simState.texts[sec.id+":"+it.no] || ((store.simWriting||{})[sec.id+":"+it.no]) || "";
        h += '<textarea class="answer" id="sim-txt-'+it.no+'" placeholder="Tulis jawabanmu di sini...">'+esc(saved)+'</textarea>'
          + '<p style="font-size:12px;color:#555">Jawaban tersimpan otomatis saat pindah soal / kumpulkan. Tidak dinilai otomatis.</p>';
      } else {
        ["A","B","C","D"].forEach(function(k){
          if(!it.options || !it.options[k]) return;
          var ch = simState.answers[sec.id+":"+it.no]===k ? " checked" : "";
          h += '<label><input type="radio" name="sim'+it.no+'" value="'+k+'"'+ch+'> '+k+') '+esc(it.options[k])+'</label>';
        });
      }
      h += '</div><p><button class="btn ghost" id="sim-prev">← Sebelumnya</button> '
        + '<button class="btn ghost" id="sim-next">Berikutnya →</button> '
        + '<button class="btn" id="sim-submit">Kumpulkan &amp; lihat skor</button></p></div>';
      return h;
    }
    // result
    var sc = simScore(sec);
    var pct = sc.total ? Math.round(sc.ok/sc.total*100) : 0;
    h += '<div class="card"><h3>Skor pilihan ganda: '+sc.ok+' / '+sc.total+' ('+pct+'%)</h3>'
      + '<p style="font-size:13px">Soal esai/prompt tidak masuk skor; tulisanmu tersimpan di bawah dan bisa dibaca ulang.</p>'
      + '<p><button class="btn ghost" id="sim-wrong">Tampilkan: '+(simState.wrongOnly?'semua soal':'yang salah saja')+'</button> '
      + '<button class="btn ghost" id="sim-retry">Ulangi section ini</button></p></div>';
    sec.items.forEach(function(it){
      if(simState.wrongOnly && it.type!=="prompt" && simState.answers[sec.id+":"+it.no]===it.answer) return;
      var mine = simState.answers[sec.id+":"+it.no];
      var ok = mine===it.answer;
      h += '<div class="quiz-q"><p><b>'+it.no+'. '+esc(it.question)+'</b></p>';
      if(it.type==="prompt"){
        var txt = ((store.simWriting||{})[sec.id+":"+it.no]) || "";
        h += '<p style="font-size:13px"><b>Tulisanmu tersimpan:</b></p><div class="ex" style="white-space:pre-wrap">'+esc(txt||"(kosong)")+'</div>'
          + '<p style="font-size:13px"><b>Contoh jawaban/model:</b> '+esc(it.answer)+'</p>'
          + (it.explanation? '<p style="font-size:13px"><b>Pembahasan:</b> '+esc(it.explanation)+'</p>':'');
      } else {
        h += '<p>Jawabanmu: <b>'+esc(mine||"-")+'</b> · Kunci: <b>'+esc(it.answer)+'</b></p>'
          + '<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Benar! ':'Kurang tepat. ')+esc(it.explanation||"")+'</div>';
      }
      h += '</div>';
    });
    return h;
  }
  function bindSim(){
    document.querySelectorAll(".sim-g").forEach(function(b){
      b.addEventListener("click", function(){ simStopTimer(); simState.group=b.getAttribute("data-g"); simState.sel=0; simState.started=false; simState.submitted=false; simState.idx=0; simState.answers={}; simState.texts={}; simRerender(); });
    });
    document.querySelectorAll(".sim-s").forEach(function(b){
      b.addEventListener("click", function(){ simStopTimer(); simState.sel=parseInt(b.getAttribute("data-i"),10); simState.started=false; simState.submitted=false; simState.idx=0; simState.answers={}; simState.texts={}; simRerender(); });
    });
    var st = document.getElementById("sim-start");
    if(st) st.addEventListener("click", function(){
      simState.started=true; simState.submitted=false; simState.idx=0; simState.answers={}; simState.texts={}; simState.wrongOnly=false;
      simStartTimer(); simRerender();
    });
    document.querySelectorAll(".sim-j").forEach(function(b){
      b.addEventListener("click", function(){ simCollect(); simState.idx=parseInt(b.getAttribute("data-j"),10); simRerender(true); });
    });
    var pv = document.getElementById("sim-prev");
    if(pv) pv.addEventListener("click", function(){ simCollect(); if(simState.idx>0) simState.idx--; simRerender(true); });
    var nx = document.getElementById("sim-next");
    if(nx) nx.addEventListener("click", function(){ simCollect(); var sec=simCurrent(); if(simState.idx<sec.items.length-1) simState.idx++; simRerender(true); });
    var sm = document.getElementById("sim-submit");
    if(sm) sm.addEventListener("click", function(){ simSubmit(false); });
    var wr = document.getElementById("sim-wrong");
    if(wr) wr.addEventListener("click", function(){ simState.wrongOnly=!simState.wrongOnly; simRerender(true); });
    var rt = document.getElementById("sim-retry");
    if(rt) rt.addEventListener("click", function(){ simState.started=false; simState.submitted=false; simState.idx=0; simState.answers={}; simState.texts={}; simRerender(); });
  }
  function simRerender(keepTimer){
    var app = document.getElementById("app");
    app.innerHTML = simPage(); bindSim();
    if(!keepTimer) window.scrollTo(0,0);
  }

  function router(){
    var hash = location.hash || "#/";
    var app = document.getElementById("app");
    var mm = hash.match(/^#\/module\/(\w+)$/);
    if(hash.indexOf("#/sim")!==0) simStopTimer();
    if(mm){ app.innerHTML = modulePage(mm[1]); bindModule(mm[1]); }
    else if(hash.indexOf("#/flashcard")===0){ app.innerHTML = flashcardPage(); bindFlashcard(); }
    else if(hash.indexOf("#/quiz")===0){ app.innerHTML = quizPage(); bindQuiz(); }
    else if(hash.indexOf("#/texts")===0){ app.innerHTML = textsPage(); bindTexts(); }
    else if(hash.indexOf("#/grammar")===0){ app.innerHTML = grammarPage(); bindGrammar(); }
    else if(hash.indexOf("#/sim")===0){ app.innerHTML = simPage(); bindSim(); }
    else if(hash.indexOf("#/exam")===0){ app.innerHTML = examPage(); bindExam(); }
    else { app.innerHTML = dashboard(); }
    var isDash = (!mm && hash.indexOf("#/flashcard")!==0 && hash.indexOf("#/quiz")!==0 && hash.indexOf("#/texts")!==0 && hash.indexOf("#/grammar")!==0 && hash.indexOf("#/exam")!==0 && hash.indexOf("#/sim")!==0);
    document.getElementById("nav-dash").className = isDash? "active": "";
    document.getElementById("nav-fc").className = (hash.indexOf("#/flashcard")===0)? "active": "";
    document.getElementById("nav-qz").className = (hash.indexOf("#/quiz")===0)? "active": "";
    document.getElementById("nav-tx").className = (hash.indexOf("#/texts")===0)? "active": "";
    document.getElementById("nav-gr").className = (hash.indexOf("#/grammar")===0)? "active": "";
    document.getElementById("nav-ex").className = (hash.indexOf("#/exam")===0)? "active": "";
    document.getElementById("nav-sim").className = (hash.indexOf("#/sim")===0)? "active": "";
    var hm = document.getElementById("hdr-meta");
    if(hm) hm.textContent = "· "+DATA_EN.meta.totalModules+" modul · "+DATA_EN.meta.levelRange+" · offline";
    window.scrollTo(0,0);
  }
  if(typeof DATA_EN==="undefined"){ document.getElementById("app").innerHTML='<div class="card"><b>data-en.js tidak terbaca.</b> Pastikan file data-en.js sejajar dengan index.html lalu refresh.</div>'; return; }
  window.addEventListener("hashchange", router);
  document.addEventListener("click", function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-speak]") : null;
    if(!b) return;
    ev.preventDefault();
    var txt = b.getAttribute("data-speak") || "";
    if(!txt) return;
    if(!canSpeak()){
      b.textContent = "🔇";
      b.title = "Browser tidak mendukung audio";
      return;
    }
    doSpeak(txt);
  });
  var mb = document.getElementById("menu-btn");
  if(mb) mb.addEventListener("click", function(){ document.getElementById("sidebar").classList.toggle("open"); });
  document.querySelectorAll("#sidebar nav a").forEach(function(a){
    a.addEventListener("click", function(){ document.getElementById("sidebar").classList.remove("open"); });
  });
  router();
})();
</script>
</body>
</html>
